name: CI/CD - RCC-HIROS-DEMO

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allow manual redeploys from the Actions tab

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dongbuds/rcc-hiros-demo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps + generate Prisma client
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
        env:
          DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"   # build-time placeholder only

      - name: Build (validates the app compiles)
        run: npm run build
        env:
          DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"
          JWT_SECRET: "ci-placeholder-secret"
          NEXT_PUBLIC_KIOSK_SERVICE_URL: "http://127.0.0.1:8765"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.IMAGE }}:latest
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  deploy:
    needs: build
    runs-on: [self-hosted, windows, rcc-demo-host]   # runs ON the target server — no SSH, no secrets
    steps:
      - name: Deploy local Docker stack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location C:\Users\AMD\rcc-hiros-demo
          docker compose pull cloudflared
          docker compose pull app
          if ($LASTEXITCODE -ne 0) {
            Write-Host "GHCR pull failed - falling back to locally built image (until package is public or docker login is done)"
          }
          docker compose run --rm --no-deps app npx prisma db push
          docker compose up -d --remove-orphans app cloudflared
          docker image prune -f
